name: lint

on:
  push:
    branches:
    - main
  pull_request:
    types:
    - synchronize
    - opened
    - reopened
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

jobs:
  go-lint:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --config configs/golangci.yaml
